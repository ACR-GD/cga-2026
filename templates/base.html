<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CGA 2026 Explorer{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header, main { max-width: 1080px; margin: 0 auto; padding: 16px; }
    nav a { color: #93c5fd; text-decoration: none; margin-right: 12px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .muted { color: #94a3b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    a.btn { display: inline-block; padding: 6px 10px; background: #334155; border-radius: 8px; color: #e2e8f0; text-decoration: none; }
    ul { margin: 0; padding-left: 20px; }
    input, select { background: #0b1220; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; }
    .media { width: 100%; max-width: 360px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 10px; }
    .media-small { width: 100%; max-width: 220px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>CGA 2026 Explorer</h1>
    <p class="muted">Nominations, profils publics, trailers et stats.</p>
    <nav>
      <a href="/">Accueil</a>
      <a href="/games">Jeux</a>
      <a href="/studios">Studios</a>
      <a href="/stats">Stats</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
